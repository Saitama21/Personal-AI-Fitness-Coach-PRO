<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f0eb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111411" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FORMA AI" />
  <meta name="format-detection" content="telephone=no" />
  <title>FORMA AI</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div id="app" class="app-shell" aria-live="polite">
    <header class="topbar">
      <button class="brand glass-button" data-action="home" aria-label="На главную">
        <span class="brand-mark">F</span>
        <span><b>FORMA</b><small>AI COACH</small></span>
      </button>
      <div class="topbar-actions">
        <button class="icon-button glass-button" data-action="install" aria-label="Установить приложение" title="Установить">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="profile-button glass-button" data-action="profile" aria-label="Профиль"><span id="avatarText">И</span></button>
      </div>
    </header>

    <main id="screenRoot" class="screen-root"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" data-screen="home" aria-label="Сегодня">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 11.3 8.5-7 8.5 7"/><path d="M5.8 10.4v9.1h12.4v-9.1M9.2 19.5v-5.4h5.6v5.4"/></svg>
        <span>Сегодня</span>
      </button>
      <button class="nav-item" data-screen="plan" aria-label="План">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.2" y="5.4" width="15.6" height="14.4" rx="2.6"/><path d="M7.2 3.7v3.4M16.8 3.7v3.4M4.4 9h15.2"/><path d="m8.2 14 2 2 5-5"/></svg>
        <span>План</span>
      </button>
      <button class="nav-item nav-primary" data-screen="workout" aria-label="Старт тренировки">
        <span class="primary-orb">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10v4M6.5 8.2v7.6M17.5 8.2v7.6M20.5 10v4M6.5 12h11"/></svg>
        </span>
        <span>Старт</span>
      </button>
      <button class="nav-item" data-screen="progress" aria-label="Прогресс">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19v-6M10 19V8M15 19v-9M20 19V5"/><path d="M3.8 19.5h17"/></svg>
        <span>Прогресс</span>
      </button>
      <button class="nav-item" data-screen="coach" aria-label="Тренер">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3.2"/><path d="M6.3 20c.5-4 2.5-6 5.7-6s5.2 2 5.7 6"/><path d="M4.5 9.7v3.8M19.5 9.7v3.8"/></svg>
        <span>Тренер</span>
      </button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
