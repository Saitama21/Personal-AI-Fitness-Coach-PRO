<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ddd6cf" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FORMA AI" />
  <meta name="format-detection" content="telephone=no" />
  <title>FORMA AI</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div id="app" class="app-shell" aria-live="polite">
    <header class="topbar">
      <button class="brand glass-button" data-action="home" aria-label="На главную">
        <span class="brand-mark">F</span>
        <span><b>FORMA</b><small>AI COACH</small></span>
      </button>
      <div class="topbar-actions">
        <button class="icon-button glass-button" data-action="install" aria-label="Установить приложение" title="Установить">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="profile-button glass-button" data-action="profile" aria-label="Профиль"><span id="avatarText">И</span></button>
      </div>
    </header>

    <main id="screenRoot" class="screen-root"></main>

    <nav class="bottom-nav glass-panel" aria-label="Основная навигация">
      <button class="nav-item active" data-screen="home" aria-label="Сегодня">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10.5V20h13v-9.5M9 20v-6h6v6"/></svg>
        <span>Сегодня</span>
      </button>
      <button class="nav-item" data-screen="plan" aria-label="План">
        <svg viewBox="0 0 24 24"><path d="M6 3v3M18 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/><path d="m8 13 2 2 5-5"/></svg>
        <span>План</span>
      </button>
      <button class="nav-item nav-primary" data-screen="workout" aria-label="Тренировка">
        <span class="primary-orb">
          <svg viewBox="0 0 24 24"><path d="M4 10v4M7 8v8M17 8v8M20 10v4M7 12h10"/></svg>
        </span>
        <span>Старт</span>
      </button>
      <button class="nav-item" data-screen="progress" aria-label="Прогресс">
        <svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>
        <span>Прогресс</span>
      </button>
      <button class="nav-item" data-screen="coach" aria-label="ИИ-тренер">
        <svg viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8v6a2 2 0 0 0 2 2h2v-6H5v-2a7 7 0 0 1 14 0v2h-3v6h2a2 2 0 0 0 2-2v-6a8 8 0 0 0-8-8Z"/><path d="M10 19h4"/></svg>
        <span>Тренер</span>
      </button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
